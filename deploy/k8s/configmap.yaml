apiVersion: v1
kind: ConfigMap
metadata:
  name: maintai-config
  namespace: default
  labels:
    app.kubernetes.io/name: maintai
    app.kubernetes.io/component: config
data:
  NODE_ENV: "production"
  PORT: "3000"
  HOSTNAME: "0.0.0.0"
  AI_PROVIDER: "groq"
  GROQ_MODEL: "llama-3.3-70b-versatile"
  GEMINI_MODEL: "gemini-1.5-flash"
  OPENAI_MODEL: "gpt-4o"
